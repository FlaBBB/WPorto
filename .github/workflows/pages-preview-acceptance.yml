name: Pages preview acceptance

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve Pages preview URL
        id: preview
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          alias=$(printf '%s' "$PR_BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
          alias=${alias#-}
          alias=${alias%-}
          echo "url=https://${alias}.wporto.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$PREVIEW_URL" | grep --fixed-strings --quiet '<title>Signal Ledger — Fikri Flab</title>'; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages preview did not serve the Portfolio Site: $PREVIEW_URL" >&2
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance suite against preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npm test
