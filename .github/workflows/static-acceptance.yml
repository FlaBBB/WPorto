name: Static acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and Svelte types
        run: npm run check

      # The engines are ~600MB, and downloading them on every run pushed the job
      # past its cap while the suite was still running. The key follows the lock
      # file, so a Playwright bump re-downloads and every other run reuses them.
      - name: Cache browser engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test production static output
        run: npm test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-results
          path: test-results/
