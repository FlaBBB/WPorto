name: Production acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and Svelte types
        run: npm run check

      - name: Wait for the canonical production release
        env:
          PRODUCTION_URL: https://flab.my.id
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$PRODUCTION_URL/.build-metadata.json" | grep --fixed-strings --quiet "\"commit\":\"${EXPECTED_COMMIT}\""; then
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$PRODUCTION_URL" | grep --fixed-strings --quiet '<title>flab — Fikri Muhammad Abdillah</title>'; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Canonical production did not serve the expected Portfolio Site: $PRODUCTION_URL" >&2
          exit 1

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser acceptance suite against canonical production
        env:
          PLAYWRIGHT_BASE_URL: https://flab.my.id
        run: npm test

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-results
          path: test-results/

  verify-redirects:
    name: Canonical redirect / ${{ matrix.hostname }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        hostname: [www.flab.my.id, wporto.pages.dev]
    steps:
      - name: Verify permanent redirect with path and query preserved
        env:
          SOURCE: https://${{ matrix.hostname }}/redirect-check/nested?source=acceptance
          TARGET: https://flab.my.id/redirect-check/nested?source=acceptance
        run: |
          actual=$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' --max-redirs 0 "$SOURCE")
          if [ "$actual" != "301 $TARGET" ]; then
            echo "Expected 301 redirect from $SOURCE to $TARGET; got: $actual" >&2
            exit 1
          fi
